<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loose Ends</title>
    <meta name="description" content="Find the book series you never finished. Your Goodreads export, parsed in your browser." />
    <meta name="theme-color" content="#f1f3f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f131a" media="(prefers-color-scheme: dark)" />

    <!-- Instrument Serif sets the title, the counts and the series names;
         DM Sans does everything else. Both are needed before first paint,
         so they are preconnected rather than discovered in the CSS. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Instrument+Serif&display=swap"
    />

    <!-- Shared links render as a bare URL without these. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Loose Ends" />
    <meta property="og:description" content="You've read four. There are seven. Here's book five. Drop in a Goodreads export - it's parsed in your browser and never uploaded." />
    <meta property="og:url" content="https://looseends.karska-dev.workers.dev/" />
    <meta property="og:image" content="https://looseends.karska-dev.workers.dev/preview.png" />
    <meta property="og:image:alt" content="The Loose Ends series board, showing unfinished book series and the next unread volume in each." />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
